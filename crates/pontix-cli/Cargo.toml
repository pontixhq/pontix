[package]
name = "pontix-cli"
description = "The pontix command line tool."
license-file = "../../LICENSE-FSL.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "pontix"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.10", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
pontix-core = { path = "../pontix-core" }
pontix-index = { path = "../pontix-index" }
pontix-parsers = { path = "../pontix-parsers" }
pontix-scan = { path = "../pontix-scan" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
