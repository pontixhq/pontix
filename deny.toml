# cargo-deny configuration: licenses, advisories, bans and sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is shared policy; not every license is used yet.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Workspace crates are not published yet (publish = false); their own licenses
# (Apache-2.0 and FSL-1.1-ALv2) are declared in each Cargo.toml.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; that is not a crates.io wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# ruff_unicode_names2 (pulled in by ruff_python_parser) embeds Unicode data
# under Unicode-DFS-2016. Allowed for this crate only, not workspace-wide.
[[licenses.exceptions]]
crate = "ruff_unicode_names2"
allow = ["Unicode-DFS-2016"]